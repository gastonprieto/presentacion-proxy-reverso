# Proxy reverso (8080 HTTP, 8443 HTTPS) y API gateway (8090) de tienda.com.
# Después de editar: docker compose exec proxy nginx -s reload
events {}

http {
    # Cada pedido en el log: quién pidió qué, a qué servicio fue y qué volvió.
    log_format ruta '$remote_addr  $request  →  ${proxy_host} ${upstream_addr}  $status  '
                    '${body_bytes_sent} B  cache=${upstream_cache_status}  ${request_time} s';
    access_log /dev/stdout ruta;
    error_log /dev/stderr warn;

    # DNS de Docker: con "resolve", nginx se entera cuando se agregan o quitan réplicas.
    resolver 127.0.0.11 valid=2s ipv6=off;

    # ---------- Servicios (adentro de cada uno, nginx balancea round robin) ----------
    upstream usuarios { zone usuarios 64k; server usuarios:3000 resolve; }
    upstream ordenes  { zone ordenes 64k;  server ordenes:3000 resolve; }
    upstream envios   { zone envios 64k;   server envios:3000 resolve; }
    upstream pagos    { zone pagos 64k;    server pagos:3000 resolve; }
    upstream pagos_v2 { zone pagos_v2 64k; server pagos-v2:3000 resolve; }
    upstream web      { zone web 64k;      server web:3000 resolve; }

    # Enrutar por header: "X-Version: 2" manda /pagos a Pagos v2.
    map $http_x_version $pagos {
        "2"     pagos_v2;
        default pagos;
    }

    # Lo que el proxy les cuenta a los servicios sobre el pedido original.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ---------- Lo que se resuelve una sola vez, adelante ----------
    # 🗜 Compresión: gzip para todas las respuestas de texto.
    gzip on;
    gzip_types text/plain application/javascript;
    gzip_min_length 1000;

    # 💾 Caché de estáticos (la usa la regla /static/ en reglas.conf).
    proxy_cache_path /var/cache/nginx/estaticos keys_zone=estaticos:1m max_size=50m;

    # 🔒 TLS: el certificado vive sólo acá. Del proxy a los servicios va HTTP.
    server {
        listen 80;
        listen 443 ssl;
        server_name tienda.localhost;
        ssl_certificate     /certs/tienda.crt;
        ssl_certificate_key /certs/tienda.key;

        include /etc/nginx/lab/reglas.conf;

        # Hay regla, pero el servicio no contesta: el 502 lo da el proxy.
        error_page 502 504 = @caido;
        location @caido {
            default_type text/plain;
            return 502 "502 del proxy: hay regla para $uri, pero el servicio no responde\n";
        }
    }

    # ---------- API gateway: proxy reverso + quién es el cliente ----------
    # 🔑 Cada token identifica a un cliente; sin token válido → 401.
    map $http_authorization $cliente {
        "Bearer token-navegador"  navegador;
        "Bearer token-app-movil"  app-movil;
        default                   "";
    }
    # ⏱ Límite por cliente: 5 pedidos por segundo (con ráfagas de hasta 5 más); el excedente → 429.
    limit_req_zone $cliente zone=porcliente:1m rate=5r/s;

    server {
        listen 8090;
        default_type text/plain;
        limit_req_status 429;
        error_page 429 = @limite;

        if ($cliente = "") {
            return 401 "401 del gateway: falta el token o no es válido\n";
        }
        limit_req zone=porcliente burst=5 nodelay;
        # Al definir un header acá, nginx deja de heredar los del bloque http: se repiten.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Cliente         $cliente;

        location /usuarios { proxy_pass http://usuarios; }
        location /ordenes  { proxy_pass http://ordenes; }
        location /pagos    { proxy_pass http://pagos; }
        location /         { return 404 "404 del gateway: no hay ninguna API en $uri\n"; }
        location @limite   { return 429 "429 del gateway: $cliente pasó el límite de 5 pedidos por segundo\n"; }
    }
}
