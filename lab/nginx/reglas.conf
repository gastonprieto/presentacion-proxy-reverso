# Reglas del proxy: ruta → servicio. Las usan el puerto 8080 (HTTP) y el 8443 (HTTPS).
# nginx elige la regla con el prefijo MÁS LARGO que coincide (no la primera).
# Después de editar: docker compose exec proxy nginx -s reload

location /usuarios {
    proxy_pass http://usuarios;
}

location /ordenes {
    proxy_pass http://ordenes;
}

# ✂ Separar Envíos de Órdenes: descomentá estas 3 líneas y recargá.
# location /ordenes/envios {
#     proxy_pass http://envios;
# }

# /pagos va a Pagos, o a Pagos v2 si el pedido trae "X-Version: 2" (ver $pagos en nginx.conf).
location /pagos {
    proxy_pass http://$pagos;
}

# Archivos estáticos: comprimidos y guardados en la caché del proxy.
location /static/ {
    proxy_cache estaticos;
    proxy_cache_valid 200 1m;
    add_header X-Cache $upstream_cache_status always;
    proxy_pass http://web;
}

# Sin regla: el 404 lo da el proxy, el pedido no llega a ningún servicio.
location / {
    default_type text/plain;
    return 404 "404 del proxy: no hay regla para $uri\n";
}
